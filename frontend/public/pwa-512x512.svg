<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="border_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="brand_primary" x1="90" y1="80" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="brand_accent" x1="120" y1="100" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="gold_accent" x1="220" y1="120" x2="290" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#border_grad)" stroke-width="4" fill="none" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="220" r="130" fill="#6366f1" opacity="0.22" filter="url(#glow)" />

  <!-- Modern Architectural Apex (Bachelor Home Roofline / Crown) -->
  <path d="M256 82 L400 196 L366 224 L256 138 L146 224 L112 196 Z" fill="url(#brand_accent)" filter="url(#glow)" />

  <!-- Left Pillar / B Spine -->
  <rect x="144" y="196" width="36" height="196" rx="18" fill="url(#brand_primary)" />
  
  <!-- Right Pillar / H Right Spine -->
  <rect x="332" y="196" width="36" height="196" rx="18" fill="url(#brand_primary)" />

  <!-- Center Crossbar Connecting B & H -->
  <rect x="168" y="278" width="176" height="32" rx="16" fill="url(#brand_accent)" />

  <!-- B Upper Loop -->
  <path d="M172 196 H236 C268 196 288 214 288 242 C288 270 268 288 236 288 H172" fill="none" stroke="url(#brand_primary)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- B Lower Loop -->
  <path d="M172 284 H244 C278 284 300 304 300 334 C300 366 276 392 238 392 H172" fill="none" stroke="url(#brand_primary)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Luminous Heart / Home Core (Golden Keyhole / Window) -->
  <circle cx="256" cy="178" r="16" fill="url(#gold_accent)" filter="url(#glow)" />

  <!-- Wordmark 'BACHELOR HOME' at bottom -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="6" text-anchor="middle">BACHELOR HOME</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="4" text-anchor="middle">SMART ERP</text>
</svg>
